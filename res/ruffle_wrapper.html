<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;overflow:hidden;">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="game_chrome.css">
</head>
<body>
<div id="chrome" role="toolbar"></div>
<div id="stage"><div id="surface"></div></div>
<div id="actionToast" role="status" aria-live="polite" hidden></div>

<script src="game-timing.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var swfUrl = params.get('swf');
  var proxyUrl = params.get('proxy');
  var ruffleUrl = params.get('ruffle') || 'ruffle/ruffle.js';
  var quality = params.get('quality') || 'low';
  if (['low', 'medium', 'high', 'best'].indexOf(quality) === -1) quality = 'low';
  if (!swfUrl) return;

  // Some Flash games talk to their servers over raw TCP, which Ruffle (sandboxed, no raw
  // sockets) cannot do directly. Every (host, port) pair such a game may connect to must be
  // pre-registered and redirected through our local WebSocket<->TCP relay (res/socketProxy.js).
  // The owning plugin declares them in its wrap config (wrap.ruffle.socket), passed here as
  // the "cfg" parameter: { socket: { serversApi, fallbackHosts, policyPort } }. A game
  // without a socket section simply gets no relay.
  var cfg = {};
  try { cfg = JSON.parse(params.get('cfg') || '{}') || {}; } catch (e) { cfg = {}; }
  var socketCfg = cfg.socket || null;

  function addHostPort(map, host, port) {
    port = Number(port);
    if (typeof host !== 'string' || !host || !Number.isInteger(port) || port < 1 || port > 65535) return;
    if (!map.has(host)) map.set(host, new Set());
    map.get(host).add(port);
    if (socketCfg && socketCfg.policyPort) map.get(host).add(socketCfg.policyPort); // Flash cross-domain policy socket
  }

  function mapToSocketProxies(map) {
    var proxies = [];
    map.forEach(function (ports, host) {
      ports.forEach(function (port) {
        proxies.push({ host: host, port: port, proxyUrl: proxyUrl + '?host=' + encodeURIComponent(host) + '&port=' + port });
      });
    });
    return proxies;
  }

  async function buildSocketProxies() {
    var map = new Map();
    var fallback = socketCfg.fallbackHosts || {};
    Object.keys(fallback).forEach(function (host) {
      fallback[host].forEach(function (port) { addHostPort(map, host, port); });
    });

    // The server list is the source of truth; the fallback only covers it being unreachable.
    if (socketCfg.serversApi) {
      try {
        var res = await fetch(socketCfg.serversApi);
        var servers = await res.json();
        servers.forEach(function (server) { addHostPort(map, server.sIP, server.iPort); });
      } catch (e) {
        console.log('[AquGrim] Server list unavailable, using fallback hosts only:', e);
      }
    }

    return mapToSocketProxies(map);
  }

  async function startPlayer() {
    var socketProxy = (proxyUrl && socketCfg) ? await buildSocketProxies() : [];

    // Same fix as Flash <param name="base">: a loader that resolves its own files as relative
    // URLs would otherwise resolve them against this file:// wrapper page.
    var swfBase = '';
    try {
      var u = new URL(swfUrl);
      swfBase = new URL('.', u).href;
    } catch (e) {}

    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.tabIndex = 0;
    document.getElementById('surface').appendChild(player);

    var loadOpts = {
      url: swfUrl,
      quality: quality,
      preferredRenderer: 'wgpu-webgl',
      allowScriptAccess: true,
      allowNetworking: 'all',
      allowFullscreen: true,
      splashScreen: false,
      autoplay: 'on',
      backgroundExecutionMode: 'mainThread',
      unmuteOverlay: 'hidden',
      // Letterbox the stage instead of stretching it.
      letterbox: 'on',
      socketProxy: socketProxy
    };
    if (swfBase) loadOpts.base = swfBase;

    player.ruffle(1).load(loadOpts).then(function () {
      try { player.focus({ preventScroll: true }); } catch (e) { /* the page can still be clicked */ }
    }).catch(function (e) {
      console.error('[AquGrim] Ruffle load failed:', e);
    });
  }

  // The bundled player remains the offline fallback. When an update exists this
  // loads its self-hosted JS/WASM files from AquaStar's AppData directory instead.
  var script = document.createElement('script');
  script.src = ruffleUrl;
  script.onload = startPlayer;
  script.onerror = function () { console.error('[AquGrim] Could not load Ruffle:', ruffleUrl); };
  document.head.appendChild(script);
})();
</script>
<script src="game_chrome.js"></script>
</body>
</html>
