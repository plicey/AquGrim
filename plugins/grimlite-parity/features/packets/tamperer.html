<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packet Tamperer</title>
<link rel="stylesheet" href="../../../../res/features/common/focus.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 13px;
  }
  body { display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; gap: 8px; }
  textarea {
    font-family: Consolas, "Courier New", monospace; font-size: 12px; resize: none;
    background: #1b1b1b; border: 1px solid #333; border-radius: 4px; padding: 6px;
    color: #dedede; box-sizing: border-box; width: 100%;
  }
  textarea:focus { outline: none; border-color: #4da3ff; }
  #send { flex: 0 0 34%; }
  #receive { flex: 1 1 auto; }
  #toolbar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; flex-wrap: wrap; }
  #toolbar label { display: flex; align-items: center; gap: 5px; color: #dcdcdc; cursor: pointer; }
  .spacer { flex: 1 1 auto; }
  #filterRow { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  #filter {
    flex: 1 1 auto; font-family: inherit; font-size: 12px; background: #1b1b1b;
    border: 1px solid #333; border-radius: 4px; padding: 5px 8px; color: #dcdcdc;
  }
  #filter:focus { outline: none; border-color: #4da3ff; }
  button {
    font: inherit; font-size: 12px; color: #e6e6e6; background: #232323; border: 1px solid #383838;
    border-radius: 4px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #2c2c2c; }
  button:disabled { color: #6f6f6f; cursor: default; background: #1b1b1b; }
  #status { flex: 0 0 auto; min-height: 17px; color: #9a9a9a; font-size: 12px; }
  #status.err { color: #ff8e8e; }
  #status.ok { color: #7fd08a; }
  #banner { flex: 0 0 auto; padding: 8px 10px; background: #3a2a12; border: 1px solid #57401c; border-radius: 4px; color: #f0c987; font-size: 12px; }
  #banner.hidden { display: none; }
</style>
</head>
<body>
  <div id="banner" class="hidden"></div>
  <div id="toolbar">
    <label><input type="checkbox" id="fromServer"> <span id="fromServerLabel">Capture from server</span></label>
    <label><input type="checkbox" id="fromClient"> <span id="fromClientLabel">Capture from client</span></label>
    <span class="spacer"></span>
    <button id="clear">Clear</button>
    <button id="toClient">Send to client</button>
    <button id="toServer">Send to server</button>
  </div>

  <textarea id="send" spellcheck="false" placeholder="The frame to send"></textarea>
  <textarea id="receive" readonly spellcheck="false"></textarea>

  <div id="filterRow">
    <span id="filterLabel">Filter by text</span>
    <input id="filter" type="text">
  </div>
  <div id="status"></div>

  <script>
  (function () {
    const api = window.aquastarTamperer;
    const sendBox = document.getElementById('send');
    const receiveBox = document.getElementById('receive');
    const filterBox = document.getElementById('filter');
    const status = document.getElementById('status');
    const fromClient = document.getElementById('fromClient');
    const fromServer = document.getElementById('fromServer');
    const toServerButton = document.getElementById('toServer');
    const toClientButton = document.getElementById('toClient');
    const clearButton = document.getElementById('clear');
    // btnToServer_Click / btnToClient_Click disable the button they are on while their frame is
    // on its way, and only that one; the state lives here so a draw() cannot re-enable it early.
    const pending = { toServer: false, toClient: false };
    let failure = '';

    function switches() {
      return { fromClient: fromClient.checked, fromServer: fromServer.checked };
    }

    function draw() {
      toServerButton.disabled = pending.toServer;
      toClientButton.disabled = pending.toClient;
      // btnClear_Click has no guard: Clear is always live, and clearing an empty box is nothing.
      clearButton.disabled = false;
      const watching = fromClient.checked || fromServer.checked;
      status.className = failure ? 'err' : (watching ? 'ok' : '');
      status.textContent = failure || (watching
        ? 'Capturing ' + (fromClient.checked ? 'client' : '') +
          (fromClient.checked && fromServer.checked ? ' and ' : '') +
          (fromServer.checked ? 'server' : '') + ' traffic.'
        : 'Tick a capture switch to watch one side of the session.');
    }

    // Each tick of a switch goes to the main process, which subscribes the tap while either is on
    // and gates each direction itself: the reference hooks one callback per checkbox.
    async function applySwitches() {
      const wanted = switches();
      failure = '';
      draw();
      try {
        if (wanted.fromClient || wanted.fromServer) await api.watch(wanted);
        else await api.unwatch();
      } catch (error) {
        failure = 'Could not read traffic: ' + ((error && error.message) || error);
      }
      draw();
    }

    fromClient.addEventListener('change', applySwitches);
    fromServer.addEventListener('change', applySwitches);

    api.onCapture(function (payload) {
      receiveBox.value = payload.text;
      receiveBox.scrollTop = receiveBox.scrollHeight;
      draw();
    });

    filterBox.addEventListener('input', function () {
      api.setFilter(filterBox.value);
    });

    clearButton.addEventListener('click', async function () {
      await api.clear();
      receiveBox.value = '';
      draw();
    });

    // "if (!string.IsNullOrEmpty(txtSend.Text))": an empty box sends nothing, on either side.
    async function send(target, action) {
      if (!sendBox.value.length) return;
      pending[target] = true;
      draw();
      let answer;
      try {
        answer = await action();
      } catch (error) {
        answer = null;
      } finally {
        pending[target] = false;
      }
      failure = answer && answer.sent ? '' : 'Nothing was written: the client is not connected to the relay.';
      draw();
    }

    toServerButton.addEventListener('click', function () {
      send('toServer', function () { return api.sendToServer(sendBox.value); });
    });

    toClientButton.addEventListener('click', function () {
      send('toClient', function () { return api.sendToClient(sendBox.value); });
    });

    sendBox.addEventListener('input', draw);

    api.getMessages().then(function (messages) {
      document.title = messages.title || 'Packet Tamperer';
      document.getElementById('fromClientLabel').textContent = messages.captureFromClient;
      document.getElementById('fromServerLabel').textContent = messages.captureFromServer;
      document.getElementById('filterLabel').textContent = messages.filterByText;
      document.getElementById('toServer').textContent = messages.sendToServer;
      document.getElementById('toClient').textContent = messages.sendToClient;
      document.getElementById('clear').textContent = messages.clear;
      draw();
    });

    // Steering is the player's opt-in (packets.js): with it off there is no relay, so the switches
    // have nothing to read and the send buttons have nowhere to write. The window says so.
    api.steering().then(function (answer) {
      if (!answer || !answer.notice) return;
      const banner = document.getElementById('banner');
      banner.textContent = answer.notice;
      banner.classList.remove('hidden');
    }).catch(function () { /* the status line reports what went wrong */ });

    // Opening the window reads nothing: the reference hooks its callbacks when a switch is ticked.
    api.unwatch().catch(function () { /* nothing was watching yet */ });
    draw();
  })();
  </script>
</body>
</html>
