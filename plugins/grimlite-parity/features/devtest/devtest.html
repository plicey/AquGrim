<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dev Test</title>
<link rel="stylesheet" href="../../../../res/features/common/focus.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 13px;
  }
  body { padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  .modes { display: flex; gap: 14px; align-items: center; }
  label { user-select: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1; background: #1b1b1b; color: #e6e6e6; border: 1px solid #2c2c2c;
    border-radius: 4px; padding: 5px 7px; font-size: 13px;
  }
  input[type=text]:disabled { opacity: 0.5; }
  textarea {
    flex: 1; resize: none; background: #1b1b1b; color: #e6e6e6; border: 1px solid #2c2c2c;
    border-radius: 4px; padding: 7px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.4; white-space: pre;
  }
  button {
    background: #262626; color: #e6e6e6; border: 1px solid #383838; border-radius: 4px;
    padding: 6px 10px; cursor: pointer;
  }
  button:hover { background: #303030; }
  button:disabled { opacity: 0.5; cursor: default; }
  .grow { flex: 1; }
  .status { color: #9a9a9a; min-height: 16px; }
  .status.bad { color: #ff8a80; }
</style>
</head>
<body>
  <div class="modes" id="modes"></div>

  <div class="row">
    <label for="fn">Function</label>
    <input type="text" id="fn" value="world" spellcheck="false">
  </div>

  <div class="row">
    <label for="args">Args</label>
    <input type="text" id="args" value="arg1,arg2..." spellcheck="false">
    <input type="checkbox" id="argsEnabled" checked title="Pass the arguments above">
  </div>

  <div class="row">
    <button id="call">Call</button>
    <div class="grow"></div>
  </div>

  <textarea id="result" spellcheck="false" placeholder="result"></textarea>
  <div class="status" id="status"></div>

  <div class="row">
    <button id="copy">Copy</button>
    <div class="grow"></div>
    <button id="format">Format JSON</button>
  </div>

<script src="devtest.js"></script>
</body>
</html>
