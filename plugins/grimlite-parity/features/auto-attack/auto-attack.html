<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AquGrim - Auto Attack Skill Set</title>
<link rel="stylesheet" href="../../../../res/features/common/focus.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 13px;
  }
  body { display: flex; flex-direction: column; padding: 14px; gap: 10px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 15px; }
  p { margin: 0; color: #9a9a9a; font-size: 12px; line-height: 1.4; }
  textarea {
    flex: 1 1 auto; min-height: 90px; resize: none; box-sizing: border-box;
    background: #1b1b1b; color: #e6e6e6; border: 1px solid #383838; border-radius: 4px;
    padding: 8px; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; }
  button {
    background: #262626; color: #e6e6e6; border: 1px solid #383838;
    border-radius: 4px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #303030; }
  #status { min-height: 16px; color: #7fd08a; }
  #status.err { color: #ff8e8e; }
</style>
</head>
<body>
  <h1>Auto Attack Skill Set</h1>
  <p>Ordered skills for Auto Attack only. Use commas or semicolons. Examples: <code>1,2,3,4</code> or <code>1,2:SH&gt;60,3:SM&lt;30,wait</code>. Empty uses the class preset.</p>
  <textarea id="skills" spellcheck="false" placeholder="1,2,3,4"></textarea>
  <div class="row">
    <div class="grow" id="status" role="status"></div>
    <button id="clear">Clear</button>
    <button id="save">Save</button>
  </div>
<script>
(function () {
  var api = window.aquastarAutoAttack;
  var box = document.getElementById('skills');
  var status = document.getElementById('status');

  function say(text, error) {
    status.textContent = text || '';
    status.className = error ? 'err' : '';
  }

  function save() {
    Promise.resolve(api.save(box.value)).then(function (result) {
      if (result && result.ok) {
        box.value = result.text || '';
        say('Saved. It applies the next time Auto Attack starts.');
      } else say((result && result.error) || 'Could not save.', true);
    });
  }

  document.getElementById('save').addEventListener('click', save);
  document.getElementById('clear').addEventListener('click', function () {
    box.value = '';
    save();
  });
  box.addEventListener('keydown', function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
      event.preventDefault();
      save();
    }
  });

  Promise.resolve(api.get()).then(function (result) {
    box.value = (result && result.text) || '';
    box.focus();
  }, function (error) {
    say((error && error.message) || 'Could not load.', true);
  });
})();
</script>
</body>
</html>
