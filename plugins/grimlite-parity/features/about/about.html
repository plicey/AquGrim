<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AquGrim - About</title>
<link rel="stylesheet" href="../../../../res/features/common/focus.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 13px;
  }
  body { display: flex; flex-direction: column; box-sizing: border-box; padding: 16px; gap: 12px; overflow-y: auto; }
  h1 { margin: 0; font-size: 20px; }
  #version { color: #9a9a9a; }
  #logo { width: 96px; height: 96px; align-self: flex-end; margin-top: -64px; }
  .card { border: 1px solid #2c2c2c; border-radius: 8px; padding: 12px; background: #1b1b1b; }
  h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6f6f6f; }
  ul { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  li { display: flex; align-items: baseline; gap: 8px; }
  h3 { margin: 10px 0 6px; font-size: 12px; color: #b9b9b9; }
  #prose { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #b9b9b9; }
  a, button.link { color: #7ec8f2; background: none; border: none; padding: 0; font: inherit; cursor: pointer; text-align: left; }
  a:hover, button.link:hover { color: #b3e0ff; text-decoration: underline; }
  li span.plain { color: #9a9a9a; }
  #reloadRow { display: flex; align-items: center; gap: 10px; }
  #swf { flex: 1 1 auto; background: #161616; color: #e6e6e6; border: 1px solid #383838;
    border-radius: 4px; padding: 6px 8px; font: inherit; }
  button.pick { background: #232323; color: #e6e6e6; border: 1px solid #383838; border-radius: 4px; padding: 6px 12px; font-size: 12px; }
  button.pick:hover { background: #2c2c2c; }
  #status { color: #9a9a9a; }
</style>
</head>
<body>
  <h1>Grimlite Li</h1>
  <div id="version">…</div>
  <img id="logo" src="grimoire-icon.png" alt="Grimlite Li logo">

  <div class="card">
    <div id="teams"></div>
    <h2 id="creditsHeading">Credits</h2>
    <div id="prose"></div>
  </div>

  <div class="card">
    <h2 id="gameHeading">Game</h2>
    <div id="reloadRow">
      <input id="swf" type="text" spellcheck="false">
      <button id="reload" class="pick" type="button">Load Game SWF</button>
    </div>
    <div id="status" style="margin-top:8px"></div>
  </div>

  <script>
    (function () {
      var bridge = window.aquastarAbout || null;
      var version = document.getElementById('version');
      var teams = document.getElementById('teams');
      var prose = document.getElementById('prose');
      var swf = document.getElementById('swf');
      var status = document.getElementById('status');

      if (!bridge) return;

      bridge.getInfo().then(function (info) {
        var messages = (info && info.messages) || {};
        version.textContent = (info.version || '') + (info.port ? ' · ' + info.port : '');
        (info.teams || []).forEach(function (team) {
          var heading = document.createElement('h3');
          heading.textContent = team.heading;
          teams.appendChild(heading);
          var list = document.createElement('ul');
          (team.links || []).forEach(function (link) {
            var item = document.createElement('li');
            if (!link.url) {
              // A name with no reachable handler upstream: shown, not clickable.
              var plain = document.createElement('span');
              plain.className = 'plain';
              plain.textContent = link.label;
              item.appendChild(plain);
            } else {
              var button = document.createElement('button');
              button.type = 'button';
              button.className = 'link';
              button.textContent = link.label;
              button.addEventListener('click', function () { bridge.openLink(link.url); });
              item.appendChild(button);
            }
            list.appendChild(item);
          });
          teams.appendChild(list);
        });
        prose.textContent = info.prose || '';
        swf.value = info.swfPath || '';
        if (messages.reloadHint) status.textContent = messages.reloadHint;
      });

      document.getElementById('reload').addEventListener('click', function () {
        bridge.loadSwf(swf.value).then(function (result) {
          status.textContent = (result && result.status) || '';
        });
      });
    })();
  </script>
</body>
</html>
